    "streamlit>=1.62.0",
    "yfinance>=1.7.0",
]

[project.scripts]
vixsnap = "vixsnap:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
