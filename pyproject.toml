[project]
name = "vixsnap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mglaserg", email = "mglaserg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
